# ==============================================================================
# Tokioba IoT Gateway Router - Nginx (Puerto 80)
# Enrutamiento basado en Cookie (iot_target) con Selector Visual y WebSockets
# ==============================================================================

# Resolución DNS dinámica dentro de la red interna de Docker
resolver 127.0.0.11 valid=30s ipv6=off;

# Upstreams internos
upstream custom_backend {
    server web:8081;
    keepalive 32;
}

upstream traccar_backend {
    server traccar:8082;
    keepalive 32;
}

# Mapeo de cabecera Connection para soporte óptimo de WebSockets (RFC 6455)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Mapeo de la cookie iot_target al upstream correspondiente
map $cookie_iot_target $backend_upstream {
    "custom"   http://custom_backend;
    "traccar"  http://traccar_backend;
    default    "selector";
}

server {
    listen 80;
    server_name _;

    # Ocultar versión de Nginx y configurar límites
    server_tokens off;
    client_max_body_size 50M;

    # Forzar redirecciones relativas (previene degradación a http:// en túneles SSL como ZROK)
    absolute_redirect off;

    # 1. Neutralización de Service Worker de Traccar (PWA)
    # Evita que el navegador instale /sw.js en el scope raíz y secuestre la navegación hacia /selector
    location ~* ^/(sw|service-worker)\.js$ {
        default_type application/javascript;
        add_header Content-Type "application/javascript" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        return 200 'self.addEventListener("install", () => self.skipWaiting()); self.addEventListener("activate", (event) => { event.waitUntil(self.registration.unregister().then(() => self.clients.matchAll()).then((clients) => { clients.forEach(client => client.navigate(client.url)); })); });';
    }

    # 2. Selector Visual de Plataforma (HTML estático con anti-cache estricto)
    # Al acceder al selector se asegura la eliminación de la cookie iot_target
    location = /selector {
        root /usr/share/nginx/html;
        try_files /selector.html =404;
        add_header Set-Cookie "iot_target=; Path=/; Max-Age=0; SameSite=Lax" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /selector/ {
        return 302 /selector;
    }

    # 3. Endpoint para fijar Plataforma Propia (React + FastAPI en 8081)
    location = /set-platform/custom {
        add_header Set-Cookie "iot_target=custom; Path=/; SameSite=Lax" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 302 /;
    }

    # 4. Endpoint para fijar Consola Traccar (Puerto 8082)
    location = /set-platform/traccar {
        add_header Set-Cookie "iot_target=traccar; Path=/; SameSite=Lax" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 302 /;
    }

    # 5. Atajos directos por URL (/custom y /traccar)
    location = /custom {
        add_header Set-Cookie "iot_target=custom; Path=/; SameSite=Lax" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 302 /;
    }

    location = /traccar {
        add_header Set-Cookie "iot_target=traccar; Path=/; SameSite=Lax" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 302 /;
    }

    # 6. Endpoint para volver a elegir plataforma / limpiar cookie
    location = /logout-platform {
        add_header Set-Cookie "iot_target=; Path=/; Max-Age=0; SameSite=Lax" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 302 /selector;
    }

    # 7. Proxy Principal: Si no hay cookie definida, redirige al selector
    # Si hay cookie (custom o traccar), enruta al 100% preservando URIs y WebSockets
    location / {
        if ($backend_upstream = "selector") {
            return 302 /selector;
        }

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        # Evitar compresión aguas arriba para que sub_filter pueda inyectar en HTML
        proxy_set_header Accept-Encoding "";

        # WebSockets (Traccar /api/socket y eventos FastAPI)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Cabeceras de cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts extendidos para conexiones persistentes
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_buffering off;

        # Botón flotante accesible para volver al Selector Tokioba desde cualquier pantalla
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</body>' '<a id="tokioba-gateway-pill" href="/logout-platform" style="position:fixed;bottom:14px;right:14px;z-index:9999999;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:#0b0f19;color:#38bdf8;border:1px solid rgba(56,189,248,0.4);border-radius:9999px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;font-size:12px;font-weight:600;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,0.6);backdrop-filter:blur(8px);cursor:pointer;transition:all .2s;" onmouseover="this.style.background=\'#0284c7\';this.style.color=\'#fff\'" onmouseout="this.style.background=\'#0b0f19\';this.style.color=\'#38bdf8\'">&#8634; Selector Tokioba</a></body>';
    }
}
