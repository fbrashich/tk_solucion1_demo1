# ==============================================================================
# Tokioba IoT Gateway Router - Nginx (Puerto 80)
# Enrutamiento basado en Cookie (iot_target) con Selector Visual y WebSockets
# ==============================================================================

# Resolución DNS dinámica dentro de la red interna de Docker
resolver 127.0.0.11 valid=30s ipv6=off;

# Upstreams internos
upstream custom_backend {
    server web:8081;
    keepalive 32;
}

upstream traccar_backend {
    server traccar:8082;
    keepalive 32;
}

# Mapeo de cabecera Connection para soporte óptimo de WebSockets (RFC 6455)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Mapeo de la cookie iot_target al upstream correspondiente
map $cookie_iot_target $backend_upstream {
    "custom"   http://custom_backend;
    "traccar"  http://traccar_backend;
    default    "selector";
}

server {
    listen 80;
    server_name _;

    # Ocultar versión de Nginx y configurar límites
    server_tokens off;
    client_max_body_size 50M;

    # 1. Selector Visual de Plataforma (HTML estático con anti-cache estricto)
    location = /selector {
        root /usr/share/nginx/html;
        try_files /selector.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /selector/ {
        return 302 /selector;
    }

    # 2. Endpoint para fijar Plataforma Propia (React + FastAPI en 8081)
    location = /set-platform/custom {
        add_header Set-Cookie "iot_target=custom; Path=/; Max-Age=86400; SameSite=Lax" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 302 /;
    }

    # 3. Endpoint para fijar Consola Traccar (Puerto 8082)
    location = /set-platform/traccar {
        add_header Set-Cookie "iot_target=traccar; Path=/; Max-Age=86400; SameSite=Lax" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 302 /;
    }

    # 4. Endpoint para volver a elegir plataforma / limpiar cookie
    location = /logout-platform {
        add_header Set-Cookie "iot_target=; Path=/; Max-Age=0; SameSite=Lax" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 302 /selector;
    }

    # 5. Proxy Principal: Si no hay cookie definida, redirige al selector
    # Si hay cookie (custom o traccar), enruta al 100% preservando URIs y WebSockets
    location / {
        if ($backend_upstream = "selector") {
            return 302 /selector;
        }

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        # WebSockets (Traccar /api/socket y eventos FastAPI)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Cabeceras de cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts extendidos para conexiones persistentes
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }
}
