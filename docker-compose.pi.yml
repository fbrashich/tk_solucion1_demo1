services:
  # Base de Datos PostgreSQL (optimizada para bajo consumo y en SSD)
  db:
    image: postgres:15-alpine
    container_name: telemetry_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry
    volumes:
      - /mnt/ssd/tokioba-iot/data/postgres:/var/lib/postgresql/data
    command: >
      postgres 
      -c shared_buffers=24MB 
      -c work_mem=4MB 
      -c maintenance_work_mem=16MB 
      -c max_connections=20
      -c checkpoint_completion_target=0.7
    deploy:
      resources:
        limits:
          memory: 100M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Ingestor Telemático Traccar (Headless ultraliviano para Teltonika FMC/FMB920)
  traccar:
    image: traccar/traccar:alpine
    container_name: telemetry_traccar
    restart: unless-stopped
    ports:
      # Puerto 5027 mapeado tanto TCP (Portmap.io) como UDP (Playit.gg)
      - "5027:5027/tcp"
      - "5027:5027/udp"
    expose:
      - "8082"
    volumes:
      - /mnt/ssd/tokioba-iot/traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - /mnt/ssd/tokioba-iot/data/traccar/logs:/opt/traccar/logs
      - /mnt/ssd/tokioba-iot/data/traccar/data:/opt/traccar/data
    environment:
      # Optimización estricta JVM para Raspberry Pi de 1 GB RAM
      - JAVA_TOOL_OPTIONS=-Xms48m -Xmx160m -XX:+UseSerialGC
    deploy:
      resources:
        limits:
          memory: 220M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # Backend FastAPI Tokioba
  api:
    image: tokioba-iot-api:latest
    container_name: telemetry_api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/telemetry
      - SECRET_KEY=tokioba_super_secret_pi_key_2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - TRACCAR_API_URL=http://traccar:8082/api
      - TRACCAR_USER=admin@tokioba.com
      - TRACCAR_PASSWORD=tokioba_admin_2026
    ports:
      - "8000:8000"
    volumes:
      - /mnt/ssd/tokioba-iot/backend/app:/app/app
      - /mnt/ssd/tokioba-iot/data/traccar/logs:/opt/traccar/logs:ro
    depends_on:
      - db
      - traccar
    deploy:
      resources:
        limits:
          memory: 120M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Servidor Web Nginx (Sirve directamente frontend compilado desde SSD en 8081)
  web:
    image: nginx:alpine
    container_name: telemetry_web
    restart: unless-stopped
    expose:
      - "8081"
    volumes:
      - /mnt/ssd/tokioba-iot/frontend/dist:/usr/share/nginx/html:ro
      - /mnt/ssd/tokioba-iot/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 30M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Gateway Router Nginx (Único servicio expuesto en puerto 80 con Selector Visual y Enrutamiento por Cookie)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: telemetry_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - web
      - traccar
    deploy:
      resources:
        limits:
          memory: 30M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Túnel Público Seguro para el Gateway Web (ZROK)
  zrok:
    image: openziti/zrok2:latest
    container_name: telemetry_zrok
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 20s
    depends_on:
      - gateway
    volumes:
      - ${HOME}/.zrok2:/home/ziggy/.zrok2
    command: share public http://gateway:80 -n public:iot-web-portal --headless
    deploy:
      resources:
        limits:
          memory: 30M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
