services:
  db:
    image: postgres:15-alpine
    container_name: telemetry_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telemetry_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/telemetry
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: telemetry_web
    restart: always
    depends_on:
      - api
    ports:
      - "3000:80"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: telemetry_tunnel
    restart: always
    depends_on:
      - web
    command: tunnel --no-autoupdate run --token eyJhIjoiYzExNTgwZTJiMjU2MDg4ZWFiNGI0NzY0ODRhMDNkZmMiLCJ0IjoiYTM4NDMxNzYtODhjNC00MDQzLThmNTctZWNhZWUyODBiMGZiIiwicyI6Ik9UUTNNVGM0TVdNdFpUYzNaUzAwTW1GaUxUbG1aR010Tm1Nek4yVmhORFJsTW1ZMSJ9

  zrok:
    image: openziti/zrok:latest
    container_name: telemetry_zrok
    restart: unless-stopped
    profiles: ["zrok"]
    depends_on:
      - web
    environment:
      - ZROK_ENABLE_TOKEN=${ZROK_ENABLE_TOKEN:-}
    volumes:
      - ${USERPROFILE:-$HOME}/.zrok2:/home/ziggy/.zrok2
      - zrok_data:/home/ziggy/.zrok_data
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      if [ ! -f /home/ziggy/.zrok2/environment.json ] && [ ! -f /home/ziggy/.zrok/environment.json ]; then
        if [ -n \"$$ZROK_ENABLE_TOKEN\" ]; then
          echo 'Habilitando entorno Zrok con token...'
          zrok enable $$ZROK_ENABLE_TOKEN
        else
          echo 'Aviso: No se encontro entorno zrok habilitado ni variable ZROK_ENABLE_TOKEN.'
          sleep infinity
        fi
      fi
      echo 'Iniciando túnel público zrok hacia http://web:80 ...'
      zrok share public http://web:80 --headless
      "

volumes:
  postgres_data:
  zrok_data:
