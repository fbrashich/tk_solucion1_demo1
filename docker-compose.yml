services:
  db:
    image: postgres:15-alpine
    container_name: telemetry_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telemetry_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/telemetry
      - TRACCAR_URL=https://demo4.traccar.org
      - TRACCAR_EMAIL=fabianb@tokioba.com
      - TRACCAR_PASSWORD=Radius@1290!
      - TRACCAR_TOKEN=ehbiEoV1hUuCqWIQu0bpWZ:APA91bEoJ55-LLnp_udh3ZXpQXua_GfSup_Ttoh8_Ms_-iQUnOzNpbWgqq4wHFDyPjFYpjlXiksyI704909AB7fCbzOAxnBjH7_ULR9Zw4xo2A_YpATk3dA
      - TRACCAR_SYNC_INTERVAL=5
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  traccar:
    image: traccar/traccar:alpine
    container_name: telemetry_traccar
    restart: always
    ports:
      - "5027:5027/tcp"
      - "5027:5027/udp"
    expose:
      - "8082"
    volumes:
      - ./traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: telemetry_web
    restart: always
    expose:
      - "8081"
    depends_on:
      - api

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: telemetry_gateway
    restart: always
    ports:
      - "80:80"
    depends_on:
      - web
      - traccar

  zrok:
    image: openziti/zrok2:latest
    container_name: telemetry_zrok
    restart: always
    depends_on:
      - gateway
    volumes:
      - ${USERPROFILE:-$HOME}/.zrok2:/home/ziggy/.zrok2
    command: share public http://gateway:80 -n public:tk-iot-demo --headless

volumes:
  postgres_data:
