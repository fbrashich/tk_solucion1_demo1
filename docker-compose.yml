services:
  db:
    image: postgres:15-alpine
    container_name: telemetry_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telemetry_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/telemetry
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: telemetry_web
    restart: always
    depends_on:
      - api
    ports:
      - "3000:80"

  zrok:
    image: openziti/zrok2:latest
    container_name: telemetry_zrok
    restart: always
    depends_on:
      - web
    volumes:
      - ${USERPROFILE:-$HOME}/.zrok2:/home/ziggy/.zrok2
    command: share public http://web:80 -n public:tk-iot-demo --headless

volumes:
  postgres_data:
